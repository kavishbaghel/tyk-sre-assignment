apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tyk-sre-assignment-app.fullname" . }}
  namespace: {{ include "tyk-sre-assignment-app.namespace" . }}
  labels:
    {{- include "tyk-sre-assignment-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "tyk-sre-assignment-app.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "tyk-sre-assignment-app.selectorLabels" . | nindent 8 }}

    spec:
      serviceAccountName: {{ include "tyk-sre-assignment-app.serviceAccountName" . }}

      containers:
        - name: tyk-sre-assignment
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          args:
            - "--address"
            - ":8080"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3


          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          resources:
            {{- toYaml .Values.resources | nindent 12 }}