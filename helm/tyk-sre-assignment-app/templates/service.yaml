apiVersion: v1
kind: Service
metadata:
  name: {{ include "tyk-sre-assignment-app.fullname" . }}
  namespace: {{ include "tyk-sre-assignment-app.namespace" . }}
  labels:
    {{- include "tyk-sre-assignment-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "tyk-sre-assignment-app.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP