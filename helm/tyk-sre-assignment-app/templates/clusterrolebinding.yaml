apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "tyk-sre-assignment-app.fullname" . }}
  labels:
    {{- include "tyk-sre-assignment-app.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "tyk-sre-assignment-app.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tyk-sre-assignment-app.serviceAccountName" . }}
    namespace: {{ include "tyk-sre-assignment-app.namespace" . }}