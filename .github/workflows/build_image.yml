name: Build docker image for Tyk SRE Assignment
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: golang/go.mod
          cache: true

      - name: Install dependencies
        working-directory: golang
        run: go mod download

      - name: Verify modules
        working-directory: golang
        run: go mod verify

      - name: Run tests
        working-directory: golang
        run: go test ./...

      - name: Go static analysis
        working-directory: golang
        run: go vet ./...

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short,prefix=
            type=raw,value=latest,prefix=


      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: ./golang
          file: ./golang/Dockerfile
          push: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Scan docker image with trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: json
          output: trivy-report.json
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

      - name: Upload trivy artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-${{ github.sha }}
          path: trivy-report.json
          retention-days: 14
      
      - name: Generate Trivy summary
        run: |
          echo "## Trivy Vulnerability Scan" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if jq -e '.Results | map(select(.Vulnerabilities != null and (.Vulnerabilities | length > 0))) | length > 0' trivy-report.json > /dev/null; then
            echo "### Vulnerabilities detected" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"

            jq -r '
              .Results[] |
              select(.Vulnerabilities != null) |
              .Vulnerabilities[] |
              "\(.Severity) | \(.VulnerabilityID) | \(.PkgName) | \(.InstalledVersion) -> \(.FixedVersion // "Not fixed") | \(.Title // "")"
            ' trivy-report.json >> "$GITHUB_STEP_SUMMARY"

            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No vulnerabilities detected" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Push Docker image
        run: |
          docker tag ghcr.io/${{ github.repository }}:${{ github.sha }} ghcr.io/${{ github.repository }}:latest
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}:latest

